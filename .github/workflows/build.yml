# Builds the game's packages on GitHub's machines with GameCI (https://game.ci):
# Linux, Windows and macOS builds and the two Android APKs.
#
# It needs a Unity licence, given to the repository as three secrets:
# UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD. Until they exist the jobs
# finish at once with a warning. How to set them up:
# docs/en/how-to/build-in-github-actions.md
#
# Pushing a tag that starts with "v" also publishes the packages as a GitHub
# release, which anybody can download without signing in.
name: Build packages

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'To try out the release step: a name for a draft release (for example v0.0-test). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop builds use GameCI's own build method (the scene list and the
          # player settings come from the project); the result lands in
          # Builds/<target>/.
          - name: Linux
            targetPlatform: StandaloneLinux64
            buildMethod: ''
            output: Builds/StandaloneLinux64
            artifact: PrdivyZavod-linux
            folder: PrdivyZavod
          - name: Windows
            targetPlatform: StandaloneWindows64
            buildMethod: ''
            output: Builds/StandaloneWindows64
            artifact: PrdivyZavod-windows
            folder: PrdivyZavod
          - name: macOS
            targetPlatform: StandaloneOSX
            buildMethod: ''
            output: Builds/StandaloneOSX
            artifact: PrdivyZavod-macos
          # The Android builds go through the project's own build script, which
          # sets architecture, minimum Android version and graphics level.
          - name: Android
            targetPlatform: Android
            buildMethod: BuildGame.BuildAndroid
            output: Builds/Android/PrdivyZavod.apk
            artifact: PrdivyZavod-android
          - name: Android (old phones)
            targetPlatform: Android
            buildMethod: BuildGame.BuildAndroidOld
            output: Builds/Android/PrdivyZavod-old.apk
            artifact: PrdivyZavod-android-old

    steps:
      - name: Check for the Unity licence
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::warning::The UNITY_LICENSE secret is not set, so nothing was built. See docs/en/how-to/build-in-github-actions.md"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the project
        if: steps.licence.outputs.present == 'true'
        uses: actions/checkout@v7

      # The Android build image is large; make room for it.
      - name: Free disk space
        if: steps.licence.outputs.present == 'true' && matrix.targetPlatform == 'Android'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h /

      # Unity's import cache: the first build of a platform imports every asset.
      - name: Restore the Library cache
        if: steps.licence.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build with Unity
        if: steps.licence.outputs.present == 'true'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # GameCI asks GitHub which version of its tool is the newest. Without
          # a token GitHub refuses that question now and then (error 403),
          # because its build machines share their addresses. This is the job's
          # own token, which can only read (see "permissions" above).
          GITHUB_TOKEN: ${{ github.token }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: auto
          buildMethod: ${{ matrix.buildMethod }}
          buildName: PrdivyZavod
          buildsPath: Builds
          versioning: None
          allowDirtyBuild: true

      # Desktop builds are folders with files that must stay executable: pack
      # them as .tar.gz. An APK is uploaded as it is.
      - name: Pack
        if: steps.licence.outputs.present == 'true'
        env:
          OUTPUT: ${{ matrix.output }}
          ARTIFACT: ${{ matrix.artifact }}
          FOLDER: ${{ matrix.folder }}
        run: |
          mkdir -p dist
          if [ -d "$OUTPUT" ]; then
            # The Linux and Windows builds are many loose files: they get a folder
            # of their own inside the package. The macOS build is one .app already.
            inside=()
            if [ -n "$FOLDER" ]; then inside=(--transform "s,^\.,$FOLDER,"); fi
            # (Burst's debugging data is left out: it is not meant to be handed out)
            sudo tar -czf "dist/$ARTIFACT.tar.gz" --exclude='*_DoNotShip' "${inside[@]}" -C "$OUTPUT" .
          else
            sudo cp "$OUTPUT" dist/
          fi
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist

      - name: Upload the package
        if: steps.licence.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Publishes the five packages as a GitHub release when a tag starting with
  # "v" was pushed and every build job succeeded. Starting the workflow by hand
  # with a name in "draft_release" makes a draft instead: a release that only
  # people who can write to the repository see, and that creates no tag. That
  # is the way to try this job out.
  release:
    name: Publish the release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.draft_release != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # creating a release; the build jobs above can only read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release != '' }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release || github.ref_name }}

    steps:
      - name: Check out the release text
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Prepare the files
        run: |
          cd packages
          # Without the Unity licence the build jobs end without building anything.
          for f in PrdivyZavod.apk PrdivyZavod-old.apk PrdivyZavod-linux.tar.gz \
                   PrdivyZavod-windows.tar.gz PrdivyZavod-macos.tar.gz; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing, so nothing is published. Did every build job really build?"
              exit 1
            fi
          done
          # On Windows a .zip opens with a double click; nothing in it has to stay executable.
          mkdir windows
          tar -xzf PrdivyZavod-windows.tar.gz -C windows
          (cd windows && zip -q -r ../PrdivyZavod-windows.zip PrdivyZavod)
          rm -rf windows PrdivyZavod-windows.tar.gz
          sha256sum PrdivyZavod* > SHA256SUMS.txt
          ls -la

      - name: Publish
        run: |
          publish() {
            gh release create "$TAG" packages/* --title "Prdivý závod $TAG" \
              --notes-file .github/release-notes.md --generate-notes "$@"
          }
          if [ "$DRAFT" = "true" ]; then
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "::error::A release named $TAG exists already. Choose another name for the draft."
              exit 1
            fi
            publish --draft --target "$GITHUB_SHA"
          elif gh release view "$TAG" > /dev/null 2>&1; then
            # this job was run again: replace the files of the release that exists
            gh release upload "$TAG" packages/* --clobber
          else
            publish --verify-tag
          fi
          gh release view "$TAG" --json url,isDraft,assets \
            -q '.url, "draft: \(.isDraft)", (.assets[] | "\(.size)\t\(.name)")'

